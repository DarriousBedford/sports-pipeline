version: 2

sources:
  - name: raw
    schema: sports_analytics
    tables:
      - name: raw_games
        description: >
          Raw game records loaded by extract/load_to_bigquery.py.
          Append-only: the same game_id can appear multiple times (one row per load).
          Deduped to one row per game in stg_games.
        columns:
          - name: game_id
            tests:
              - not_null